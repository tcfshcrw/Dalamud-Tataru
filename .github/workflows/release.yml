name: Build & Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'pluginmaster.json'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Calculate Version
        id: calc_version
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $yy = $now.ToString("yy")
          $culture = [System.Globalization.CultureInfo]::InvariantCulture
          $week = $culture.Calendar.GetWeekOfYear($now, [System.Globalization.CalendarWeekRule]::FirstFourDayWeek, [DayOfWeek]::Monday)
          $dayOfWeek = [int]$now.DayOfWeek
          if ($dayOfWeek -eq 0) { $dayOfWeek = 7 }
          $weekStr = $week.ToString("D2")
          $dayStr = $dayOfWeek.ToString("D2")

          $baseTag = "00.$yy.$weekStr.$dayStr"
          $baseAssembly = "0.$yy.$week.$($dayOfWeek * 100)"

          $versionTag = $baseTag
          $assemblyVersion = $baseAssembly

          # Avoid collision if triggered multiple times on the same day
          $existingTags = git tag -l "$baseTag*"
          if ($existingTags) {
              $count = 1
              while (git tag -l "${baseTag}.${count}") {
                  $count++
              }
              $versionTag = "${baseTag}.${count}"
              $assemblyVersion = "0.$yy.$week.$($dayOfWeek * 100 + $count)"
          }

          Write-Host "Generated Version Tag: $versionTag"
          Write-Host "Generated Assembly Version: $assemblyVersion"

          "VERSION_TAG=$versionTag" >> $env:GITHUB_ENV
          "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV

      - name: Setup Dalamud
        shell: pwsh
        run: |
          $zipPath = "$env:RUNNER_TEMP\dalamud.zip"
          $dalamudPath = "$env:RUNNER_TEMP\dalamud"
          Write-Host "Downloading Dalamud runtime from goatcorp..."
          curl.exe -L "https://goatcorp.github.io/dalamud-distrib/latest.zip" -o $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dalamudPath -Force
          Remove-Item $zipPath
          Write-Host "Dalamud setup completed at: $dalamudPath"
          "DALAMUD_HOME=$dalamudPath" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and Package Plugin
        shell: pwsh
        run: |
          dotnet build --configuration Release -p:Platform=x64 -p:Version=${{ env.ASSEMBLY_VERSION }} -p:DalamudLibPath="$env:DALAMUD_HOME/" --no-restore

      - name: Update pluginmaster.json and Prepare Release Artifacts
        shell: pwsh
        run: |
          $zipItem = Get-ChildItem -Path "bin" -Recurse -Filter "latest.zip" | Select-Object -First 1
          if (-not $zipItem) {
              throw "latest.zip was not found anywhere in bin/!"
          }
          $packageDir = $zipItem.DirectoryName
          $manifestPath = Join-Path $packageDir "DalamudTataru.json"
          if (-not (Test-Path $manifestPath)) {
              throw "DalamudTataru.json not found at $manifestPath!"
          }

          Write-Host "Found build package directory at: $packageDir"
          $manifest = Get-Content $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()

          $pluginEntry = [ordered]@{
              Author = $manifest.Author
              Name = $manifest.Name
              Punchline = $manifest.Punchline
              Description = $manifest.Description
              InternalName = $manifest.InternalName
              AssemblyVersion = $manifest.AssemblyVersion
              RepoUrl = $manifest.RepoUrl
              ApplicableVersion = $manifest.ApplicableVersion
              DalamudApiLevel = $manifest.DalamudApiLevel
              ImageUrls = @()
              DownloadLinkInstall = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
              IsHide = $false
              IsTestingExclusive = $false
              DownloadLinkTesting = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
              DownloadLinkUpdate = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"
              DownloadCount = 0
              LastUpdated = $timestamp
          }

          $masterList = @($pluginEntry)
          $jsonContent = ConvertTo-Json $masterList -Depth 10

          # Write to repo root
          [System.IO.File]::WriteAllText("pluginmaster.json", $jsonContent, [System.Text.Encoding]::UTF8)

          # Prepare release-artifacts folder
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          Copy-Item -Path $zipItem.FullName -Destination "release-artifacts/latest.zip"
          Copy-Item -Path $manifestPath -Destination "release-artifacts/DalamudTataru.json"
          [System.IO.File]::WriteAllText("release-artifacts/pluginmaster.json", $jsonContent, [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          body: |
            ## 🌸 Tataru Native Translator ${{ env.VERSION_TAG }}

            ### 插件資訊
            - **版本號**：`${{ env.VERSION_TAG }}` (`${{ env.ASSEMBLY_VERSION }}`)
            - **支援 Dalamud API Level**：15 (FFXIV 7.x Dawntrail)

            ### Dalamud 自訂插件倉庫 (Custom Plugin Repository)
            在遊戲中開啟 Dalamud 設定，於「實驗性功能」->「自訂插件庫 (Custom Plugin Repositories)」填入以下網址：
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/pluginmaster.json
            ```
            儲存後即可直接在 Dalamud 插件清單中搜尋並安裝或更新 **Tataru Native Translator**！
          draft: false
          prerelease: false
          files: |
            release-artifacts/latest.zip
            release-artifacts/DalamudTataru.json
            release-artifacts/pluginmaster.json

      - name: Commit and push updated pluginmaster.json
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore(release): update pluginmaster.json to ${{ env.VERSION_TAG }} [skip ci]"
              git push origin main
          } else {
              Write-Host "No changes in pluginmaster.json to commit."
          }
